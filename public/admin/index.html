<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Henry Koon Thinks — Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      /* Card wrapper — relative so badge can be pinned */
      .card-wrapper {
        display: block;
        position: relative;
        min-height: 48px;
        padding-bottom: 22px;
      }
      /* Category badges — small, rounded, pastel, pinned bottom-right */
      .category-badge {
        position: absolute;
        bottom: 0;
        right: 0;
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .category-badge.life { background: #dbeafe; color: #1e40af; }
      .category-badge.faith { background: #fef3c7; color: #92400e; }
      .category-badge.essays { background: #e0e7ff; color: #3730a3; }
      .category-badge.the-outdoors { background: #dcfce7; color: #166534; }
      .category-badge.poetry { background: #fce7f3; color: #9d174d; }
      .category-badge.reviews { background: #f5f3ff; color: #6b21a8; }
      .post-date-line {
        position: absolute;
        bottom: 0;
        left: 0;
        font-size: 12px;
        color: #9ca3af;
      }

      /* Editorial workflow status labels — bold, square, high contrast */
      [class*="TopBarButton"] span,
      [data-testid*="workflow"] span {
        font-weight: 800 !important;
      }
      /* Override Decap's default status board column headers */
      [class*="ColumnHeader"],
      [class*="BoardColumn"] > div:first-child {
        font-size: 14px !important;
        font-weight: 800 !important;
        text-transform: uppercase !important;
        letter-spacing: 1px !important;
      }
      /* Status indicator badges injected by our script */
      .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-left: 10px;
        vertical-align: middle;
        border: 2px solid;
      }
      .status-badge.draft { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
      .status-badge.review { background: #fffbeb; color: #d97706; border-color: #d97706; }
      .status-badge.ready { background: #f0fdf4; color: #16a34a; border-color: #16a34a; }
    </style>
  </head>
  <body>
    <script>
      // Must register preSave BEFORE Decap CMS loads
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Strip leading tabs/spaces from markdown body before saving
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          const body = entry.get('data').get('body');
          if (body) {
            const cleaned = body.replace(/^[\t ]+/gm, '');
            return entry.get('data').set('body', cleaned);
          }
          return entry.get('data');
        },
      });
      // Now initialize CMS
      CMS.init();
    </script>
    <script>
      // Decap CMS renders the summary as plain text inside list cards.
      // This script watches for those cards and reformats them.
      const categoryColors = {
        life: 'life',
        faith: 'faith',
        essays: 'essays',
        'the-outdoors': 'the-outdoors',
        poetry: 'poetry',
        reviews: 'reviews',
      };

      function formatCards() {
        // Find all card elements that contain our summary format
        const cards = document.querySelectorAll('a[href*="/collections/posts/entries/"]');
        cards.forEach(card => {
          if (card.dataset.formatted) return;
          
          // Find the element with the summary text
          const allText = card.textContent || '';
          // Match: Title - [category]\ndate  OR  Title - [category] - date
          const match = allText.match(/^(.+?)\s*-\s*\[([^\]]+)\][\s\n-]*(\d{4}-\d{2}-\d{2}.*)$/);
          if (!match) return;

          const title = match[1].trim();
          const category = match[2].trim();
          const date = match[3].trim();

          // Find the deepest text node or span that holds the summary
          const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT, null, false);
          let textNode;
          let summaryNode = null;
          while (textNode = walker.nextNode()) {
            if (textNode.textContent.includes(title) && textNode.textContent.includes('[')) {
              summaryNode = textNode;
              break;
            }
          }

          if (summaryNode) {
            const parent = summaryNode.parentNode;
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            
            // Title
            const titleSpan = document.createElement('span');
            titleSpan.textContent = title;
            titleSpan.style.fontWeight = '600';
            titleSpan.style.color = '#111827';
            titleSpan.style.fontSize = '15px';
            titleSpan.style.display = 'block';
            titleSpan.style.paddingRight = '90px';
            wrapper.appendChild(titleSpan);

            // Category badge — pinned bottom-right
            const badge = document.createElement('span');
            badge.className = 'category-badge ' + (categoryColors[category] || '');
            badge.textContent = category.replace('-', ' ');
            wrapper.appendChild(badge);

            // Date — pinned bottom-left
            const dateLine = document.createElement('span');
            dateLine.className = 'post-date-line';
            dateLine.textContent = date;
            wrapper.appendChild(dateLine);

            parent.replaceChild(wrapper, summaryNode);
            card.dataset.formatted = 'true';
          }
        });

        // Style the editorial workflow status labels differently
        // These are Decap's built-in status indicators on the workflow board
        document.querySelectorAll('[class*="WorkflowCard"]').forEach(wfCard => {
          if (wfCard.dataset.statusStyled) return;
          const statusEl = wfCard.querySelector('[class*="CardStatus"], [class*="status"]');
          if (statusEl && !statusEl.classList.contains('status-badge')) {
            const text = statusEl.textContent.trim().toLowerCase();
            statusEl.classList.add('status-badge');
            if (text.includes('draft')) statusEl.classList.add('draft');
            else if (text.includes('review')) statusEl.classList.add('review');
            else if (text.includes('ready')) statusEl.classList.add('ready');
            wfCard.dataset.statusStyled = 'true';
          }
        });
      }

      // Run periodically since Decap CMS renders dynamically
      setInterval(formatCards, 1000);

    </script>
  </body>
</html>
