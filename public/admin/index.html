<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Henry Koon Thinks — Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      // Must register preSave BEFORE Decap CMS loads
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Strip leading tabs/spaces from markdown body before saving
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          const body = entry.get('data').get('body');
          if (body) {
            const cleaned = body.replace(/^[\t ]+/gm, '');
            return entry.get('data').set('body', cleaned);
          }
          return entry.get('data');
        },
      });
      // Now initialize CMS
      CMS.init();
    </script>
  </body>
</html>
